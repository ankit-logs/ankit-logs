<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="1" y="1" width="248" height="148" rx="14" fill="#0d1b2a" stroke="#2f4a6b" stroke-width="1.5"/>
<rect x="23" y="23" width="52" height="52" rx="13" fill="#2F81F7" fill-opacity="0.12" stroke="#2F81F7" stroke-opacity="0.5"/>
<g transform="translate(29,29)"><g fill="none" stroke="#2F81F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8 A12 12 0 1 1 8 20"/><path d="M20 3 L20 10 L13 10"/><animateTransform attributeName="transform" type="rotate" values="0 20 20;360 20 20" dur="8s" repeatCount="indefinite"/></g></g>
<text x="23" y="101" fill="#ffffff" font-size="14.5" font-weight="700">Automate the boring parts</text>
<text x="23" y="121" fill="#a9bcd6" font-size="12.5">If I do it twice, it becomes</text>
<text x="23" y="138" fill="#a9bcd6" font-size="12.5">a script or a pipeline.</text>
<rect x="276" y="1" width="248" height="148" rx="14" fill="#0d1b2a" stroke="#2f4a6b" stroke-width="1.5"/>
<rect x="298" y="23" width="52" height="52" rx="13" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950" stroke-opacity="0.5"/>
<g transform="translate(304,29)"><g fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="22" width="10" height="10" rx="2"/><rect x="18" y="22" width="10" height="10" rx="2"/><rect x="12" y="9" width="10" height="10" rx="2"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></rect></g></g>
<text x="298" y="101" fill="#ffffff" font-size="14.5" font-weight="700">Ship small, ship often</text>
<text x="298" y="121" fill="#a9bcd6" font-size="12.5">Small changes, fast feedback</text>
<text x="298" y="138" fill="#a9bcd6" font-size="12.5">and easy rollbacks.</text>
<rect x="551" y="1" width="248" height="148" rx="14" fill="#0d1b2a" stroke="#2f4a6b" stroke-width="1.5"/>
<rect x="573" y="23" width="52" height="52" rx="13" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.5"/>
<g transform="translate(579,29)"><g fill="none" stroke="#a371f7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 L34 13 L20 20 L6 13 Z"/><path d="M6 20 L20 27 L34 20"/><path d="M6 27 L20 34 L34 27"/></g></g>
<text x="573" y="101" fill="#ffffff" font-size="14.5" font-weight="700">Reproducible by default</text>
<text x="573" y="121" fill="#a9bcd6" font-size="12.5">Containers and config in Git.</text>
<text x="573" y="138" fill="#a9bcd6" font-size="12.5">No "works on my machine".</text>
<rect x="1" y="166" width="248" height="148" rx="14" fill="#0d1b2a" stroke="#2f4a6b" stroke-width="1.5"/>
<rect x="23" y="188" width="52" height="52" rx="13" fill="#d29922" fill-opacity="0.12" stroke="#d29922" stroke-opacity="0.5"/>
<g transform="translate(29,194)"><g fill="none" stroke="#d29922" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 C9 10 31 10 37 20 C31 30 9 30 3 20 Z"/><circle cx="20" cy="20" r="4.5"><animate attributeName="r" values="4.5;3;4.5" dur="3s" repeatCount="indefinite"/></circle></g></g>
<text x="23" y="266" fill="#ffffff" font-size="14.5" font-weight="700">Observe everything</text>
<text x="23" y="286" fill="#a9bcd6" font-size="12.5">Health checks, logs and metrics.</text>
<text x="23" y="303" fill="#a9bcd6" font-size="12.5">Measure it to improve it.</text>
<rect x="276" y="166" width="248" height="148" rx="14" fill="#0d1b2a" stroke="#2f4a6b" stroke-width="1.5"/>
<rect x="298" y="188" width="52" height="52" rx="13" fill="#f85149" fill-opacity="0.12" stroke="#f85149" stroke-opacity="0.5"/>
<g transform="translate(304,194)"><g fill="none" stroke="#f85149" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 L33 9 V19 C33 28 27 33 20 36 C13 33 7 28 7 19 V9 Z"/><path d="M14 20 L18.5 24.5 L26.5 15.5"/></g></g>
<text x="298" y="266" fill="#ffffff" font-size="14.5" font-weight="700">Secure by default</text>
<text x="298" y="286" fill="#a9bcd6" font-size="12.5">Non-root containers, least</text>
<text x="298" y="303" fill="#a9bcd6" font-size="12.5">privilege, no long-lived keys.</text>
<rect x="551" y="166" width="248" height="148" rx="14" fill="#0d1b2a" stroke="#2f4a6b" stroke-width="1.5"/>
<rect x="573" y="188" width="52" height="52" rx="13" fill="#0db7ed" fill-opacity="0.12" stroke="#0db7ed" stroke-opacity="0.5"/>
<g transform="translate(579,194)"><g fill="none" stroke="#0db7ed" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4 H24 L31 11 V34 H10 Z"/><path d="M24 4 V11 H31"/><path d="M15 19 H26 M15 24 H26 M15 29 H22"/></g></g>
<text x="573" y="266" fill="#ffffff" font-size="14.5" font-weight="700">Document as I go</text>
<text x="573" y="286" fill="#a9bcd6" font-size="12.5">Every repo gets a README</text>
<text x="573" y="303" fill="#a9bcd6" font-size="12.5">someone else can actually run.</text>
</svg>